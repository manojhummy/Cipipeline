name: Simple Java CD Pipeline

on:
  workflow_run:
    workflows: ["Java CI Pipeline"]
    types: [completed]

jobs:
  cd:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download artifact built in CI
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: java-artifact
          path: artifact

      # Step 2: Upload artifact to JFrog
      - name: Upload to JFrog
        run: |
          curl -H "Authorization: Bearer ${{ secrets.JFROG_ACCESS_TOKEN }}" \
          -T artifact/*.jar \
          "${{ secrets.JFROG_URL }}/artifactory/libs-release-local/"
