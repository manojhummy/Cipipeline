name: Java CD Pipeline

on:
  workflow_run:
    workflows: ["Java CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download artifact from CI
      - name: Download CI Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-artifact
          path: artifact

      # Step 2: Upload artifact to JFrog Artifactory
      - name: Upload to JFrog Artifactory
        run: |
          curl -u ${{ secrets.JFROG_USER }}:${{ secrets.JFROG_API_KEY }} \
          -T artifact/*.jar \
          "${{ secrets.JFROG_URL }}/artifactory/libs-release-local/my-java-app/myapp.jar"

      # Step 3: Copy artifact to EC2 / VM
      - name: Copy artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "artifact/*.jar"
          target: "/opt/app/"

      # Step 4: Deploy to Tomcat
      - name: Deploy to Tomcat
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl stop tomcat
            sudo cp /opt/app/*.jar /opt/tomcat/webapps/
            sudo systemctl start tomcat
