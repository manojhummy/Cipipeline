
name: Simple Java CD Pipeline

on:
  workflow_run:
    workflows: [ "Java CI Pipeline" ]
    types: [ completed ]

jobs:
  cd:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact from CI run
        uses: actions/download-artifact@v4
        with:
          name: java-artifact
          run-id: ${{ github.event.workflow_run.id }}   # 👈 fetch from CI run
          path: artifact

      - name: List files
        run: ls -la artifact

      - name: Upload to JFrog (Identity/Access Token)
        run: |
          curl -H "Authorization: Bearer ${{ secrets.JFROG_ACCESS_TOKEN }}" \
               -T artifact/*.jar \
               "${{ secrets.JFROG_URL }}/artifactory/libs-release-local/"
