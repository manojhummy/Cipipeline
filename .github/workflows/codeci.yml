name: Code CI Pipeline

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build-test-sonar:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Setup Java
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"
        cache: maven

    # Step 3: Build & Test with Maven (Generates .class & runs JUnit)
    - name: Build & Test (Maven verify)
      run: mvn -B clean verify

    # Step 4: Generate Coverage explicitly (Optional if included in verify)
    - name: Generate Coverage Report
      run: mvn jacoco:report

    # Step 5: SonarQube Analysis + Quality Gate
    - name: SonarQube Code Analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      run: |
        mvn sonar:sonar \
        -Dsonar.projectKey=my-java-app \
        -Dsonar.host.url=${SONAR_HOST_URL} \
        -Dsonar.login=${SONAR_TOKEN} \
        -Dsonar.java.coveragePlugin=jacoco \
        -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
        -Dsonar.qualitygate.wait=true

    # Step 6: Upload JAR Artifact (for CD later)
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: java-artifact
        path: target/*.jar
